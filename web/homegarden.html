<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>חקלאות ביתית · קהילה · AgroData</title>
<style>
@font-face{font-family:Rubik;src:url('fonts/Rubik.ttf');font-weight:300 900}
@font-face{font-family:Heebo;src:url('fonts/Heebo.ttf');font-weight:300 900}
@font-face{font-family:'Space Grotesk';src:url('fonts/SpaceGrotesk.ttf');font-weight:300 700}
@font-face{font-family:'Plex Mono';src:url('fonts/IBMPlexMono.ttf')}
:root{--green:#1c6b45;--green-d:#134a30;--lime:#2e9e63;--teal:#2b8fb0;--gold:#c79a2e;--ink:#14261c;--mut:#5c6f63;--line:#f4efe3;--bg2:#f4efe3;--tint:#f4efe3}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Heebo,Arial,sans-serif;background:linear-gradient(180deg,#f4efe3,#fff 240px);color:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
.topbar{background:linear-gradient(135deg,#0c1c13,#134a30)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0;color:#fff}
.nav a{color:#fff;text-decoration:none}.back{color:rgba(255,255,255,.85);font-size:14px;font-weight:600}
.wm{font-family:'Space Grotesk';font-weight:700}.wm b{color:#8fe6ad}
.hero{text-align:center;padding:34px 0 8px}
.kick{font-family:'Plex Mono';font-size:13px;color:var(--lime);letter-spacing:.1em;text-transform:uppercase}
h1{font-family:Rubik;font-size:40px;font-weight:800;margin:6px 0;color:var(--green-d)}h1 b{color:var(--lime)}
.sub{color:var(--mut);font-size:16px;max-width:640px;margin:0 auto;line-height:1.6}
.season{max-width:720px;margin:22px auto 0;background:linear-gradient(135deg,#134a30,#1c6b45);color:#fff;border-radius:0;padding:16px 20px;text-align:center}
.season .l{font-family:'Plex Mono';font-size:12px;color:#8fe6ad;letter-spacing:.08em}
.season .v{font-family:Rubik;font-weight:800;font-size:19px;margin-top:4px}
.season .v b{color:#8fe6ad}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:26px 0}
@media(max-width:820px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:0;padding:22px;transition:.15s}
.card:hover{box-shadow:0 16px 34px rgba(28,107,69,.14);transform:translateY(-3px)}
.card .em{font-size:34px}
.card h3{font-family:Rubik;font-weight:800;font-size:20px;color:var(--green-d);margin:8px 0 4px}
.card p{font-size:14.5px;color:var(--mut);line-height:1.6}
.card .tips{margin:10px 0 0;padding:0;list-style:none}
.card .tips li{font-size:13px;color:var(--ink);padding:4px 0;border-top:1px dashed var(--line)}
.card .tips li::before{content:"🌱 ";}
.links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:8px 0 40px}
.lbtn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:0;padding:12px 20px;font-family:Rubik;font-weight:800;font-size:15px;color:var(--green-d);text-decoration:none;transition:.14s}
.lbtn:hover{border-color:var(--green);background:var(--tint)}
.foot{padding:16px 0 40px;text-align:center;color:var(--mut);font-size:13px}
/* AgroData unified (homepage design) */
:root{--green:#1e5137;--green-d:#0f2a1e;--lime:#2e7d52;--teal:#8a9b8c;--gold:#a5824a;--ink:#1a2118;--mut:#5c6a5e;--line:#e0d7c2;--bg:#ebe4cf;--bg2:#f0ead9;--tint:#e6ddc9}
body{background:#ebe4cf!important}
</style>
</head>
<body>
<div class="topbar"><div class="wrap"><div class="nav">
  <a href="index.html"><span class="wm" style="font-size:22px">Agro<b>Data</b></span></a>
  <a class="back" href="community.html">→ חזרה לקהילה</a>
</div></div></div>

<div class="wrap">
  <div class="hero">
    <div class="kick">AGROHOME · קהילה</div>
    <h1>חקלאות <b>ביתית</b></h1>
    <div class="sub">לגדל מזון בבית — מרפסת, גג, גינה או מטבח. שיטות, מדריכים וטיפים לקהילת המגדלים הביתיים. ביטחון תזונתי מתחיל בבית.</div>
    <div class="season"><div class="l">מה לגדל עכשיו</div><div class="v" id="season">—</div></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="links">
    <a class="lbtn" href="agroflora.html">🌿 מזהה צמחים וליקוט</a>
    <a class="lbtn" href="agrogrow.html">🏠 חקלאות מבוקרת</a>
    <a class="lbtn" href="community.html">💬 קהילה ובלוג</a>
  </div>
</div>

<div class="foot">🪴 חקלאות ביתית · תחת <b>קהילה</b> · <span class="wm" style="color:var(--green-d)">Agro<b style="color:var(--lime)">Data</b></span> Center</div>

<script>
var M=[
 {em:'🪴',t:'גינת מרפסת',d:'עציצים וארגזי גידול — ירקות, תבלינים ופרחים במרחב קטן.',tips:['בחרו כלים עם ניקוז','תבלינים: בזיליקום, נענע, פטרוזיליה','שמש 6+ שעות ליום']},
 {em:'💧',t:'הידרופוניקה ביתית',d:'גידול במים מועשרים ללא אדמה — מהיר, נקי וחוסך מים.',tips:['חסה ועלים ירוקים מצוינים למתחילים','בדקו pH פעם בשבוע','אור גדילה (LED) לחורף']},
 {em:'🌱',t:'מיקרו-גרין ונבטים',d:'סופר-פוד ביתי תוך 7–14 יום, על שיש המטבח.',tips:['חמנייה, אפונה, צנונית','שטיפה יומית לנבטים','אין צורך באדמה עמוקה']},
 {em:'🍅',t:'גינת ירק',d:'ערוגות בחצר — ירקות עונתיים טריים מהאדמה שלכם.',tips:['סובבו גידולים בין עונות','קומפוסט מעשיר את הקרקע','השקיה בטפטוף חוסכת מים']},
 {em:'🐟',t:'אקוופוניקה',d:'דגים וצמחים במחזור סגור אחד — הדגים מזינים את הצמחים.',tips:['דגי גורמי/טילפיה נפוצים','איזון בין מספר הדגים לצמחים','מערכת קטנה מספיקה להתחלה']},
 {em:'♻️',t:'קומפוסט ביתי',d:'הופכים פסולת מטבח לזבל עשיר — פחות אשפה, יותר יבול.',tips:['שילוב "חום" (עלים) ו"ירוק" (שאריות)','הפכו את הערימה מדי שבוע','ללא בשר ומוצרי חלב']},
 {em:'🏙️',t:'גג ירוק',d:'ניצול גגות לגידול — מזון, בידוד וקירור לבית.',tips:['ודאו עומס מותר על הגג','מצעים קלים במשקל','צמחים עמידי-שמש']},
 {em:'🐝',t:'גינה מזמינה',d:'צמחי מרפא, פרחים ומאביקים — מערכת בריאה ומגוונת.',tips:['לוונדר ומרווה מושכים דבורים','הימנעו מריסוס מזיק','פינת מים קטנה']},
 {em:'📅',t:'לוח זריעה',d:'מה זורעים בכל עונה — תכנון פשוט לאורך השנה.',tips:['אביב: עגבנייה, מלפפון, פלפל','סתיו: חסה, תרד, בצל','חורף: שום, פול, אפונה']}
];
document.getElementById('grid').innerHTML=M.map(function(m){
 return '<div class="card"><div class="em">'+m.em+'</div><h3>'+m.t+'</h3><p>'+m.d+'</p><ul class="tips">'+m.tips.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul></div>';
}).join('');
/* seasonal suggestion by month */
var SEA={
 spring:'🌸 אביב — עגבנייה, מלפפון, פלפל, בזיליקום וחמניות',
 summer:'☀️ קיץ — במיה, בטטה, תירס, ותבלינים עמידי-חום',
 autumn:'🍂 סתיו — חסה, תרד, צנונית, בצל ופטרוזיליה',
 winter:'❄️ חורף — שום, פול, אפונה, כרוב ונבטים בבית'
};
var mo=new Date().getMonth(); // 0=ינו
var key=(mo>=2&&mo<=4)?'spring':(mo>=5&&mo<=7)?'summer':(mo>=8&&mo<=10)?'autumn':'winter';
document.getElementById('season').innerHTML=SEA[key];
</script>
<script src="autotranslate.js"></script>
</body>
</html>
