 ["🔄","מהפכת/מאספת חציר","קטיף ואיסוף","ייבוש ואיסוף חציר לשורות","נגרר"],
 ["📦","מכבש חבילות מרובע","קטיף ואיסוף","חבילות דחוסות להובלה","נגרר"],
 ["🌾","קצץ מספוא (Forage harvester)","קטיף ואיסוף","קציר וקיצוץ תחמיץ","עצמי-הנע"],
 ["💦","ממטרה מרכזית (Center pivot)","השקיה","השקיית שדות עגולים גדולים","זרוע מסתובבת"],
 ["💦","מכונת גלגל (Traveler)","השקיה","המטרה ניידת בשדות","גליל צינור"],
 ["🧪","ראש בקרה ודישון","השקיה","סינון, דישון ובקרת לחץ","אוטומטי"],
 ["🐄","מכון חליבה","אחסון וטיפול","חליבת עדר יעילה","אוטומטי/רובוטי"],
 ["🥣","מערבל מזון (TMR)","אחסון וטיפול","ערבוב מנת מזון לבקר","נגרר/עצמי"],
 ["🚁","רחפן זריעה","רחפנים ורובוטיקה","פיזור זרעים ומרעה מהאוויר","מיכל גרגרים"],
 ["🤖","רובוט חליבה","רחפנים ורובוטיקה","חליבה אוטונומית 24/7","זרוע רובוטית"]
];
var DICTS={
 fert:{title:"מילון דשנים והזנת הצומח",icon:"🧪",cols:["","דשן","סוג","הרכב N-P-K","שימוש","אופן יישום"],fk:2,rows:FERT},
 equip:{title:"מילון ציוד ומיכון חקלאי",icon:"🚜",cols:["","ציוד","קטגוריה","שימוש","הערה"],fk:2,rows:EQUIP}
};
var DK='fert',DFILT='all';
document.getElementById('tabs').innerHTML=Object.keys(DICTS).map(function(k,i){var d=DICTS[k];return '<button class="tab'+(i===0?' on':'')+'" onclick="tab(\''+k+'\',this)">'+d.icon+' '+d.title.replace('מילון ','')+' <span class="cnt">'+d.rows.length+'</span></button>';}).join('');
function tab(k,el){DK=k;DFILT='all';document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});el.classList.add('on');draw();}
function draw(){
 var d=DICTS[DK];
 var types=[];d.rows.forEach(function(r){if(types.indexOf(r[d.fk])<0)types.push(r[d.fk]);});
 var chips='<button class="chip on" onclick="cfilt(\'all\',this)">הכול</button>'+types.map(function(t){return '<button class="chip" onclick="cfilt(\''+t+'\',this)">'+t+'</button>';}).join('');
 document.getElementById('panel').innerHTML=
  '<div class="ptitle">'+d.icon+' '+d.title+' <span class="psub" style="display:inline">· '+d.rows.length+' פריטים</span></div>'+
  '<input class="search" id="search" oninput="body()" placeholder="🔎 חיפוש…">'+
  '<div class="chips" id="chips">'+chips+'</div>'+
  '<div class="tblwrap"><table id="tbl"></table></div>'+
  supBlock(DK);
 body();
}
function cfilt(t,el){DFILT=t;document.querySelectorAll('#chips .chip').forEach(function(x){x.classList.remove('on');});el.classList.add('on');body();}
function body(){
 var d=DICTS[DK],q=(document.getElementById('search').value||'').trim();
 var rows=d.rows.filter(function(r){
  if(DFILT!=='all'&&r[d.fk]!==DFILT)return false;
  if(!q)return true;return r.join(' ').indexOf(q)>=0;
 });
 var head='<tr>'+d.cols.map(function(c,i){return '<th'+(i===0?' style="width:44px"':'')+'>'+c+'</th>';}).join('')+'</tr>';
 var b=rows.map(function(r){
  return '<tr><td class="ic">'+r[0]+'</td>'+r.slice(1).map(function(v,i){
   var col=i+1===d.fk;var nm=i===0;
   if(col)return '<td><span class="cat" style="background:'+cc(v)+'1a;color:'+cc(v)+'">'+v+'</span></td>';
   if(nm)return '<td class="nm"><b>'+v+'</b></td>';
   if((DK==='fert')&&(i+1===3))return '<td class="mono">'+v+'</td>';
   return '<td>'+v+'</td>';
  }).join('')+'</tr>';
 }).join('');
 document.getElementById('tbl').innerHTML=head+(b||'<tr><td colspan="6" style="text-align:center;color:var(--mut);padding:24px">לא נמצאו פריטים</td></tr>');
}
draw();
</script>
</body></html>
