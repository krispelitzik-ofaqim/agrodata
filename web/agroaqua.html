 ["⚡","מדגה אינטנסיבי","אינטנסיבי","מים מתוקים","צפיפות גבוהה עם אוורור והזנה — תפוקה גבוהה לשטח."],
 ["🌊","כלובי ים (Cages)","אינטנסיבי","ים","גידול בכלובים בים פתוח — דניס, לברק, סלמון."],
 ["♻️","RAS · מערכת מים מחזורית","מחזורי (RAS)","מים מתוקים","מים ממוחזרים בסינון ביולוגי — חיסכון 90%+ מים, בקרה מלאה, כל מקום. ישראל מובילה."],
 ["🌱","אקוופוניקה","משולב","מים מתוקים","דגים + צמחים במחזור סגור — פסולת הדגים מזינה את הצמחים."],
 ["🦠","ביופלוק","מחזורי (RAS)","מים מליחים","חיידקים ממחזרים פסולת לחלבון מזין — נפוץ בשרימפס."],

 ["🏜️","בריכות מים מליחים / גיאותרמי","אקסטנסיבי","מים מליחים","ניצול מים מליחים ומי גיאותרמיה בנגב ובערבה לגידול דגים ואצות."]

 ["ViAqua Therapeutics","בריאות דגים","הגנה מפני מחלות דגים באמצעות טכנולוגיית RNA במזון — צמצום תמותה.","https://www.viaqua-t.com"],
 ["AquiNovo","תזונת דגים","תוספי מזון להאצת גדילה ושיפור יחס המרה — פחות מזון לק״ג דג.","https://www.aquinovo.com"],

};

function draw(){
 var d=DICTS[DK];
 if(d.companies){drawCo();return;}
 var types=[];d.rows.forEach(function(r){if(types.indexOf(r[d.fk])<0)types.push(r[d.fk]);});

function body(){
 var d=DICTS[DK],q=(document.getElementById('search').value||'').trim();
 var rows=d.rows.filter(function(r){if(DFILT!=='all'&&r[d.fk]!==DFILT)return false;if(!q)return true;return r.join(' ').indexOf(q)>=0;});

 var b=rows.map(function(r){return '<tr><td class="ic">'+r[0]+'</td>'+r.slice(1).map(function(v,i){

 }).join('')+'</tr>';}).join('');

}
