<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Space Grotesk';src:url('fonts/SpaceGrotesk.ttf');font-weight:300 700}
@font-face{font-family:'Plex Mono';src:url('fonts/IBMPlexMono.ttf')}
@font-face{font-family:Heebo;src:url('fonts/Heebo.ttf')}
body{margin:0;background:#fff;color:#14261c;font-family:Heebo;padding:36px}
h1{font-size:19px;color:#5c6f63;margin:0 0 26px;font-weight:700}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{border:1px solid #dbe8df;border-radius:20px;padding:30px;text-align:center}
.tag{font-family:'Plex Mono';font-size:14px;color:#2e9e63;letter-spacing:.05em;margin-bottom:18px}
.mark{height:120px;display:flex;align-items:center;justify-content:center}
.dark{background:linear-gradient(135deg,#134a30,#1c6b45);border-radius:14px;padding:14px;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:11px}
.lock{display:flex;align-items:center;justify-content:center;gap:11px;margin-top:18px;padding-top:18px;border-top:1px dashed #dbe8df}
.wm{font-family:'Space Grotesk';font-weight:700;font-size:26px;color:#14261c}.wm b{color:#2e9e63}
.wmw{font-family:'Space Grotesk';font-weight:700;font-size:20px;color:#fff}.wmw b{color:#8fe6ad}
</style></head>
<body>
<h1>Ofakim AgroData Center · מארקים קוויים מתוחכמים (על לבן + על ירוק)</h1>
<div class="row">

  <div class="card">
    <div class="tag">A · עלה-דאטה</div>
    <div class="mark">
      <svg width="96" height="96" viewBox="0 0 100 100" fill="none" stroke="#1c6b45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M50 12 C76 34 76 66 50 90 C24 66 24 34 50 12 Z"/>
        <path d="M50 22 L50 82"/><path d="M50 40 L36 32 M50 40 L64 32"/><path d="M50 58 L35 50 M50 58 L65 50"/>
        <g fill="#2e9e63" stroke="none"><circle cx="50" cy="21" r="3.2"/><circle cx="36" cy="32" r="2.5"/><circle cx="64" cy="32" r="2.5"/><circle cx="35" cy="50" r="2.5"/><circle cx="65" cy="50" r="2.5"/></g>
      </svg>
    </div>
    <div class="lock"><svg width="34" height="34" viewBox="0 0 100 100" fill="none" stroke="#1c6b45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M50 12 C76 34 76 66 50 90 C24 66 24 34 50 12 Z"/><path d="M50 22 L50 82"/><path d="M50 42 L38 35 M50 42 L62 35"/><g fill="#2e9e63" stroke="none"><circle cx="50" cy="21" r="4"/></g></svg><span class="wm">Agro<b>Data</b></span></div>
    <div class="dark"><svg width="30" height="30" viewBox="0 0 100 100" fill="none" stroke="#a7f0c1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M50 12 C76 34 76 66 50 90 C24 66 24 34 50 12 Z"/><path d="M50 22 L50 82"/><path d="M50 42 L38 35 M50 42 L62 35"/></svg><span class="wmw">Agro<b>Data</b></span></div>
  </div>

  <div class="card">
    <div class="tag">B · משושה-נבט מוקפד</div>
    <div class="mark">
      <svg width="96" height="96" viewBox="0 0 100 100" fill="none" stroke="#1c6b45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M50 10 L84 30 L84 70 L50 90 L16 70 L16 30 Z"/>
        <path d="M50 76 L50 50"/>
        <path d="M50 58 C39 58 34 50 34 42 C45 42 50 49 50 58"/>
        <path d="M50 53 C61 53 66 45 66 37 C55 37 50 44 50 53"/>
        <circle cx="50" cy="76" r="3" fill="#2e9e63" stroke="none"/>
      </svg>
    </div>
    <div class="lock"><svg width="34" height="34" viewBox="0 0 100 100" fill="none" stroke="#1c6b45" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M50 10 L84 30 L84 70 L50 90 L16 70 L16 30 Z"/><path d="M50 74 L50 52"/><path d="M50 58 C40 58 36 51 36 44 C46 44 50 50 50 58"/><path d="M50 54 C60 54 64 47 64 40 C54 40 50 46 50 54"/></svg><span class="wm">Agro<b>Data</b></span></div>
    <div class="dark"><svg width="30" height="30" viewBox="0 0 100 100" fill="none" stroke="#a7f0c1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M50 10 L84 30 L84 70 L50 90 L16 70 L16 30 Z"/><path d="M50 74 L50 52"/><path d="M50 58 C40 58 36 51 36 44 C46 44 50 50 50 58"/><path d="M50 54 C60 54 64 47 64 40 C54 40 50 46 50 54"/></svg><span class="wmw">Agro<b>Data</b></span></div>
  </div>

  <div class="card">
    <div class="tag">C · מונוגרמה A · מסלול-דאטה</div>
    <div class="mark">
      <svg width="96" height="96" viewBox="0 0 100 100" fill="none" stroke="#1c6b45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="50" cy="54" rx="36" ry="15" transform="rotate(-20 50 54)" stroke="#2e9e63" stroke-opacity=".45"/>
        <path d="M28 84 L50 18 L72 84"/><path d="M37 62 L63 62"/>
        <circle cx="50" cy="18" r="3.6" fill="#2e9e63" stroke="none"/>
        <circle cx="83" cy="47" r="2.6" fill="#2e9e63" stroke="none"/>
      </svg>
    </div>
    <div class="lock"><svg width="34" height="34" viewBox="0 0 100 100" fill="none" stroke="#1c6b45" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="50" cy="54" rx="36" ry="15" transform="rotate(-20 50 54)" stroke="#2e9e63" stroke-opacity=".5"/><path d="M28 84 L50 18 L72 84"/><path d="M37 62 L63 62"/></svg><span class="wm">Agro<b>Data</b></span></div>
    <div class="dark"><svg width="30" height="30" viewBox="0 0 100 100" fill="none" stroke="#a7f0c1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="50" cy="54" rx="36" ry="15" transform="rotate(-20 50 54)" stroke="#a7f0c1" stroke-opacity=".5"/><path d="M28 84 L50 18 L72 84"/><path d="M37 62 L63 62"/></svg><span class="wmw">Agro<b>Data</b></span></div>
  </div>
</div>
</body></html>
