<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Rubik;src:url('fonts/Rubik.ttf');font-weight:300 900}
@font-face{font-family:'Space Grotesk';src:url('fonts/SpaceGrotesk.ttf');font-weight:300 700}
@font-face{font-family:'Plex Mono';src:url('fonts/IBMPlexMono.ttf')}
body{margin:0;background:#fff;color:#14261c;font-family:Rubik,Arial;text-align:center;padding:30px}
.k{font-family:'Plex Mono';font-size:14px;color:#2e9e63;letter-spacing:.1em}
h1{font-size:34px;font-weight:800;margin:6px 0 2px}
p{color:#5c6f63;font-family:Rubik;margin:0 0 6px}
svg{width:100%;max-width:820px;height:auto}
</style></head>
<body>
<div class="k">THE BRAIN · המוח</div>
<h1>מרכז הידע — רשת התחומים</h1>
<p>ליבה אחת, תחום לכל צומת. הנתונים זורמים, המערכת חושבת.</p>
<svg id="brain" viewBox="0 0 760 600"></svg>
<script>
const NS="http://www.w3.org/2000/svg",svg=document.getElementById('brain'),CX=380,CY=300,R=215;
const D=[["חיישני שדה","#2e9e63"],["לוויין ורחפנים","#2e9e63"],["מזג אוויר","#2e9e63"],["קרקע ומים","#3aa873"],["שוק ושרשרת","#3aa873"],["מחקר ואקדמיה","#2b8fb0"],["בריאות הצומח","#3aa873"],["גנטיקה וזנים","#3aa873"],["כלכלה חקלאית","#c79a2e"]];
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
svg.innerHTML=`<defs>
  <radialGradient id="c"><stop offset="0" stop-color="#5fd191"/><stop offset=".55" stop-color="#2e9e63"/><stop offset="1" stop-color="#1c6b45"/></radialGradient>
  <filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
const P=D.map((d,i)=>{const a=(-90+i*360/D.length)*Math.PI/180;return{x:CX+R*Math.cos(a),y:CY+R*Math.sin(a),t:d[0],c:d[1]};});
for(let i=0;i<P.length;i++){const p=P[i],q=P[(i+1)%P.length];svg.appendChild(el('path',{d:`M${p.x},${p.y} L${q.x},${q.y}`,stroke:"#bcdcc8","stroke-width":"1",fill:"none"}));}
P.forEach(p=>svg.appendChild(el('path',{d:`M${CX},${CY} L${p.x},${p.y}`,stroke:p.c,"stroke-opacity":".5","stroke-width":"1.8",fill:"none"})));
[100,148,192].forEach(r=>svg.appendChild(el('circle',{cx:CX,cy:CY,r,fill:"none",stroke:"#cde7d6","stroke-width":"1"})));
P.forEach(p=>{svg.appendChild(el('circle',{cx:p.x,cy:p.y,r:"8",fill:p.c,filter:"url(#g)"}));
  svg.appendChild(el('circle',{cx:p.x,cy:p.y,r:"15",fill:"none",stroke:p.c,"stroke-opacity":".35"}));
  const top=p.y<CY-60, bot=p.y>CY+60; let lx=p.x,ly,anchor;
  if(top){ly=p.y-18;anchor="middle";}
  else if(bot){ly=p.y+26;anchor="middle";}
  else{const rt=p.x>CX;anchor=rt?"start":"end";lx=p.x+(rt?15:-15);ly=p.y+4;}
  const t=el('text',{x:lx,y:ly,"text-anchor":anchor,fill:"#14261c",style:"font:700 14px Rubik"});t.textContent=p.t;svg.appendChild(t);});
svg.appendChild(el('circle',{cx:CX,cy:CY,r:"72",fill:"url(#c)",filter:"url(#g)"}));
const t1=el('text',{x:CX,y:CY-4,"text-anchor":"middle",fill:"#fff",style:"font:700 24px 'Space Grotesk'"});t1.textContent="AgroData";
const t2=el('text',{x:CX,y:CY+20,"text-anchor":"middle",fill:"#dff3e6",style:"font:700 13px Rubik"});t2.textContent="מרכז הידע";
svg.appendChild(t1);svg.appendChild(t2);
</script>
<script src="autotranslate.js"></script>
</body></html>
